name: Telegram topic manager

# Short-polls Telegram every 5 minutes for commands, per registered chat (see
# reporter/chats_store.py). This is the practical shape of "an interactive bot" on
# Actions: runners are ephemeral, so there's no always-on connection -- commands land
# within ~5 minutes instead of instantly. Any chat that messages the bot is
# auto-registered; see reporter/bot_poll.py for command handling, including
# plain-English topic descriptions (drafted into a search query via Groq -- cheap and
# fast now that synthesis also runs on Groq, unlike the original self-hosted model this
# poller was designed around).
#
# Safe to run this often ONLY because this repo is public (unlimited free Actions
# minutes) and contains no research data or personal file listings -- see the repo
# README for why the filer agent and this reporter were deliberately split into
# separate repos over exactly this concern.

on:
  # DISABLED: superseded by the Railway webhook service (see server.py).
  # Telegram permits either getUpdates or a webhook, never both -- whichever runs
  # second gets HTTP 409, and a getUpdates call can knock the webhook offline. Do not
  # re-enable this schedule while the Railway service is deployed.
  #   schedule:
  #     - cron: '*/5 * * * *'
  workflow_dispatch: {}   # manual fallback only, e.g. if Railway is down

permissions:
  contents: write   # commits new/updated chats/ files and the update-id offset file

concurrency:
  group: telegram-bot
  cancel-in-progress: false   # never skip a poll -- a skipped offset update could replay old messages

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # an on-demand report runs the full pipeline inline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        # Full requirements: the poller can now generate a report on demand
        # (the button / /report), which needs matplotlib for the infographic.
        run: pip install -r requirements.txt

      - name: Poll for commands
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python reporter/bot_poll.py

      - name: Commit any chat/topic changes
        run: |
          git config user.name "reporter-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A over an existing directory, NOT explicit file paths: telegram-offset.json
          # only gets created once a run actually processes a message, and `git add` on
          # a path that doesn't exist is a fatal error (exit 128) that killed this step
          # on every run until it was caught.
          git add -A reporter/
          git diff --staged --quiet && exit 0
          git commit -m "Update topics via Telegram [skip ci]"
          # The weekly reporter workflow commits to the same directory tree; rebase
          # onto whatever it pushed in the meantime rather than failing outright.
          git pull --rebase origin main
          git push
