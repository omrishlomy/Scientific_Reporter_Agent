name: Weekly paper digest

on:
  # DISABLED: the Railway service runs the weekly digest in-process (APScheduler, see
  # server.py). Leaving this schedule on would deliver every chat two digests a week.
  # If Railway is ever retired, restore the two lines below.
  #   schedule:
  #     - cron: '0 5 * * 1'   # Monday 05:00 UTC = 08:00 IDT (summer); Actions cron is
  #                           # always UTC and does not shift for daylight saving.
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit updated seen.json back to the repo

concurrency:
  group: reporter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A real number this time, not a guess: fetch + two Groq API calls + rendering
    # the infographic all complete in well under a minute of actual work. Generous
    # multiple of that for headroom, not the 90 min the retired CPU-inference
    # approach needed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the reporter
        # MULTI-TENANT: no TELEGRAM_CHAT_ID here -- run_reporter_cloud.py loops over
        # every chat registered under reporter/chats/ (populated by telegram-bot.yml
        # when someone messages the bot) and sends each its own digest.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python reporter/run_reporter_cloud.py

      - name: Upload this week's output as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: reporter-output/
          retention-days: 90

      - name: Commit updated state (each chat's seen.json)
        run: |
          git config user.name "reporter-bot"
          git config user.email "actions@users.noreply.github.com"
          # -A over the directory rather than explicit paths -- see telegram-bot.yml for
          # why (a missing pathspec makes `git add` fail the whole step).
          git add -A reporter/
          git diff --staged --quiet && exit 0
          git commit -m "Update seen.json [skip ci]"
          # The 5-minute bot poller commits to this same directory tree; rebase onto
          # whatever it pushed in the meantime rather than failing outright.
          git pull --rebase origin main
          git push
