name: Weekly paper digest

on:
  schedule:
    # Monday 08:00 Israel time. GitHub Actions cron is always UTC and does not shift
    # for daylight saving, so this comment is the source of truth if the offset drifts
    # -- IDT is UTC+3 (summer) / IST is UTC+2 (winter); 05:00 UTC covers the summer
    # case (08:00 IDT). Adjust by an hour around the clock-change weekends if it matters.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed to commit updated seen.json back to the repo

concurrency:
  group: reporter
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A real number this time, not a guess: fetch + two Groq API calls + rendering
    # the infographic all complete in well under a minute of actual work. Generous
    # multiple of that for headroom, not the 90 min the retired CPU-inference
    # approach needed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run the reporter
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reporter/run_reporter_cloud.py

      - name: Upload this week's output as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: reporter-output/
          retention-days: 90

      - name: Commit updated state (seen.json)
        run: |
          git config user.name "reporter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reporter/seen.json
          git diff --staged --quiet || git commit -m "Update seen.json [skip ci]"
          git push
