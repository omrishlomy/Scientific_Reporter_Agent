settings:
  lookback_days: 7
  max_per_topic: 8
  preprints: true
topics:
- name: Respiration and the brain
  enabled: true
  query: "(TITLE:\"respiration\" OR TITLE:\"breathing\" OR TITLE:\"respiratory\"\n OR ABSTRACT:\"respiratory\
    \ rhythm\" OR ABSTRACT:\"breathing rhythm\")\nAND (TITLE:brain OR TITLE:neural OR TITLE:cortical OR\
    \ TITLE:oscillat*\n     OR ABSTRACT:\"neural oscillation\" OR ABSTRACT:EEG)\n"
- name: Disorders of Consciousness
  enabled: true
  query: "(TITLE:\"disorders of consciousness\" OR TITLE:\"vegetative state\"\n OR TITLE:\"minimally conscious\"\
    \ OR TITLE:\"unresponsive wakefulness\"\n OR ABSTRACT:\"disorders of consciousness\" OR TITLE:\"covert\
    \ consciousness\")\n"
- name: Psychedelics
  enabled: true
  query: "(TITLE:psychedelic* OR TITLE:psilocybin OR TITLE:LSD OR TITLE:ayahuasca\n OR TITLE:DMT OR TITLE:ketamine\
    \ OR TITLE:MDMA)\nAND (TITLE:brain OR TITLE:neural OR TITLE:consciousness OR TITLE:EEG\n     OR TITLE:clinical\
    \ OR TITLE:trial OR ABSTRACT:neuroimaging)\n"
- name: Neurofeedback
  enabled: true
  query: "(TITLE:neurofeedback OR ABSTRACT:neurofeedback\n OR TITLE:\"brain-computer interface\" OR TITLE:\"\
    brain computer interface\"\n OR ABSTRACT:\"real-time fMRI neurofeedback\"\n OR (TITLE:\"closed-loop\"\
    \ AND (ABSTRACT:EEG OR ABSTRACT:cortical\n                              OR ABSTRACT:neural OR ABSTRACT:brain)))\n"
- name: General query
  enabled: true
  query: TITLE:*
